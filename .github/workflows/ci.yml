name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16, 18, 20]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run all tests (including contract tests)
        run: npm test -- --watchAll=false --ci --verbose

      - name: Run contract tests only (gate)
        run: npx react-scripts test --testPathPattern="contract\\.test" --watchAll=false --ci --verbose

      - name: Upload coverage (optional)
        if: matrix.node-version == 20
        run: npm test -- --watchAll=false --coverage --ci
        env:
          CI: true

  contract-gate:
    name: Contract Schema Gate
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run contract tests
        run: npx react-scripts test --testPathPattern="contract\\.test" --watchAll=false --ci --verbose

      - name: Verify golden fixtures unchanged
        run: |
          echo "Checking golden fixture integrity..."
          FIXTURE=src/features/users/__fixtures__/golden-users.json
          if [ ! -f "$FIXTURE" ]; then
            echo "ERROR: Golden fixture file missing: $FIXTURE"
            exit 1
          fi
          echo "Golden fixtures present ✓"