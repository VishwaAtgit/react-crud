name: Strict Type Check — Observability

on:
  pull_request:
    paths:
      - "src/hooks/useObservability.ts"
      - "src/hooks/__tests__/useObservability*.ts"
      - "src/hooks/tsconfig.strict.json"
  push:
    branches: [main]
    paths:
      - "src/hooks/useObservability.ts"
      - "src/hooks/__tests__/useObservability*.ts"
      - "src/hooks/tsconfig.strict.json"

jobs:
  strict-typecheck:
    name: "tsc --strict (observability path)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci

      - name: Run strict type check
        run: |
          TSC_OUTPUT=$(npx tsc --project src/hooks/tsconfig.strict.json 2>&1 || true)
          OUR_ERRORS=$(echo "$TSC_OUTPUT" | grep "error TS" | grep -v "node_modules" || true)

          if [ -n "$OUR_ERRORS" ]; then
            echo "$OUR_ERRORS"
            echo "::error::Strict type check failed on our code."
            exit 1
          fi

          NM_COUNT=$(echo "$TSC_OUTPUT" | grep -c "node_modules" || echo 0)
          echo "✅ 0 errors in our code (${NM_COUNT} node_modules errors ignored — TS 3.9 limitation)"

      - name: Suppression budget
        if: always()
        run: |
          MAX_SUPPRESSIONS=6
          ACTUAL=$(grep -c 'eslint-disable\|@ts-ignore\|@ts-expect-error' src/hooks/useObservability.ts || echo 0)

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🔒 Strict Type Check — Observability

          | Check | Result |
          |-------|--------|
          | Type errors (our code) | ✅ 0 |
          | Suppressions | ${ACTUAL} / ${MAX_SUPPRESSIONS} |

          > TS 3.9 cannot fully skip \`node_modules\` type checking.
          > Errors from \`node_modules\` are filtered and ignored.
          > Each suppression is documented in \`docs/strictness/SUPPRESSIONS.md\`.
          EOF

          if [ "$ACTUAL" -gt "$MAX_SUPPRESSIONS" ]; then
            echo "::error::Suppression budget exceeded: ${ACTUAL} > ${MAX_SUPPRESSIONS}"
            exit 1
          fi